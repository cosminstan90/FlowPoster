services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  postgresql:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: seo_publisher
      POSTGRES_USER: seo_user
      POSTGRES_PASSWORD: seo_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo_user -d seo_publisher"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  arq-worker:
    build: .
    env_file: .env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    command: python -m arq backend.worker.worker_settings.WorkerSettings
    volumes:
      - .:/app

volumes:
  pg_data:
  redis_data:
